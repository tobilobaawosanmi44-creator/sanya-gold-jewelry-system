services:
  - type: web
    name: sanya-gold-jewelry-system
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma db push && npm run db:seed && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sanya-gold-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: sanya-gold-db
    databaseName: sanya_gold_jewelry
    user: sanya_gold_user
    plan: free
